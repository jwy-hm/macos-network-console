name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 全历史，供 privacy-check --history 扫 commit message

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Test (pytest)
        run: pytest

      - name: Privacy check (files + git history)
        run: python scripts/privacy_check.py --history

      - name: i18n check
        run: python scripts/i18n_check.py
